<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<meta name="theme-color" content="#14121c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>¿Qué tiene?</title>
<style>
  :root{--bg:#14121c;--card:#1f1c2b;--card2:#2a2639;--tx:#ece8f5;--mut:#9a93ad;--acc:#ff7aa8;--ok:#7fd6b0;--warn:#ffd27a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px 120px}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px}
  h1{font-size:20px;margin:4px 0}
  h3{font-size:15px;margin:16px 0 8px;color:var(--mut);font-weight:600}
  button{font:inherit;color:inherit;border:0;cursor:pointer}
  .sync{font-size:12px;color:var(--mut);margin-left:auto}
  .icon-btn{background:var(--card);width:44px;height:44px;border-radius:12px;font-size:20px}
  .status{display:flex;gap:8px;margin:12px 0 18px}
  .chip{flex:1;background:var(--card);border-radius:14px;padding:10px 6px;text-align:center}
  .chip b{display:block;font-size:15px}
  .chip small{color:var(--mut);font-size:12px;display:block}
  .chip em{color:var(--mut);font-size:11px;font-style:normal}
  .chip.alert b{color:var(--warn)}
  .cry{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:170px;border-radius:28px;
       background:linear-gradient(160deg,#ff7aa8,#c45ad8);color:#fff;font-size:26px;font-weight:700;box-shadow:0 10px 30px #ff7aa833;overflow:hidden}
  .cry small{font-size:14px;font-weight:500;opacity:.9;margin-top:4px}
  .cry:active{transform:scale(.98)}
  .cry .bar{position:absolute;left:0;bottom:0;height:8px;background:#fff9;width:0;transition:width .1s linear}
  .skip{display:block;margin:10px auto 0;background:none;color:var(--mut);text-decoration:underline;font-size:15px;padding:8px}
  .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
  .quick button{background:var(--card);border-radius:20px;height:96px;font-size:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .quick button span{font-size:14px;color:var(--tx)}
  .quick button:active{background:var(--card2)}
  .quick button.on{outline:2px solid var(--ok)}
  .card{background:var(--card);border-radius:22px;padding:16px;margin-top:16px}
  .top{display:flex;align-items:center;gap:12px;font-size:28px}
  .top b{font-size:24px}
  .top .pct{margin-left:auto;font-size:20px;color:var(--acc);font-weight:700}
  .why{color:var(--mut);margin:6px 0 2px;font-size:14px}
  .tip{margin:8px 0 12px;font-size:15px}
  .bars div{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin:4px 0}
  .bars i{flex:1;height:6px;border-radius:3px;background:var(--card2);position:relative;overflow:hidden}
  .bars i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--acc);border-radius:3px}
  .bars span{width:105px}
  .learn{font-size:12px;color:var(--mut);margin:10px 0 0}
  .labels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .labels button{background:var(--card2);border-radius:14px;padding:10px 2px;font-size:26px;display:flex;flex-direction:column;align-items:center}
  .labels button small{font-size:10.5px;color:var(--mut);margin-top:2px}
  .labels button:active,.labels button.sel{background:var(--ok);color:#111}
  .labels button.sel small{color:#111}
  .later{background:none;color:var(--mut);width:100%;padding:10px;font-size:14px}
  .pend{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 0;border-top:1px solid #ffffff10}
  .pend .t{flex:1 1 100%;font-size:13px;color:var(--mut)}
  .pend .pb{display:flex;gap:5px;width:100%}
  .pend .pb button{flex:1}
  .pend button{background:var(--card2);border-radius:10px;width:34px;height:38px;font-size:17px;padding:0}
  .wx{font-size:12px;color:var(--mut)}
  .menu p{margin:6px 0;font-size:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .row button,.row label,.row a{background:var(--card2);border-radius:12px;padding:10px 12px;font-size:14px;cursor:pointer;color:var(--tx);text-decoration:none}
  .danger{color:#ff8a8a!important}
  .note{font-size:12px;color:var(--mut);margin-top:10px}
  input[type=text]{width:100%;font:inherit;font-size:17px;padding:14px;border-radius:14px;border:1px solid #ffffff22;background:var(--card2);color:var(--tx);margin:6px 0 10px}
  .big{width:100%;padding:16px;border-radius:16px;font-size:17px;font-weight:600;background:linear-gradient(160deg,#ff7aa8,#c45ad8);color:#fff}
  .big.alt{background:var(--card2)}
  .or{text-align:center;color:var(--mut);margin:16px 0;font-size:13px}
  .who{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #ffffff10}
  .who .dot{width:11px;height:11px;border-radius:50%;background:#55506a;flex:none}
  .who .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .who div{flex:1}
  .who b{display:block;font-size:16px}
  .who small{color:var(--mut);font-size:13px}
  .who .on-t{color:var(--ok)}
  .age{display:block;width:100%;text-align:left;background:none;color:var(--mut);font-size:14px;padding:0 0 2px}
  .age b{color:var(--acc);font-weight:600}
  .motto{font-size:13.5px;line-height:1.4;color:#d9cfe6;font-style:italic;margin:4px 0 2px;cursor:pointer;transition:opacity .25s}
  .motto.hard{color:#ffc3dc}
  input[type=date]{width:100%;font:inherit;font-size:17px;padding:14px;border-radius:14px;border:1px solid #ffffff22;background:var(--card2);color:var(--tx);margin:6px 0 10px;color-scheme:dark}
  .spurt{background:linear-gradient(160deg,#1f3a2c,#1c2620);border:1px solid #5fd39a66;border-radius:18px;padding:14px;margin:-6px 0 16px}
  .spurt .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .spurt .top b{font-size:16px}
  .spurt .top button{background:none;color:var(--mut);font-size:13px;padding:4px 6px;min-height:0}
  .spurt .sig{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
  .spurt .sig div{background:#ffffff0d;border-radius:12px;padding:8px;text-align:center}
  .spurt .sig b{display:block;font-size:17px}
  .spurt .sig small{color:var(--mut);font-size:11.5px}
  .spurt .sig .up b{color:#7ee0ad}
  .spurt p{font-size:13.5px;line-height:1.45;margin:6px 0 0;color:#d6e8dc}
  .scard{background:linear-gradient(160deg,#2b2750,#1f1c2b);border:1px solid #7b6cf655;border-radius:18px;padding:14px;margin:-6px 0 16px}
  .scard .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .scard .top b{font-size:17px}
  .scard .top span{font-size:12px;color:var(--mut);white-space:nowrap}
  .cyc{display:flex;gap:6px;margin:12px 0 8px;flex-wrap:wrap}
  .cyc i{width:30px;height:10px;border-radius:5px;background:#ffffff14;position:relative;overflow:hidden}
  .cyc i.done{background:#7b6cf6}
  .cyc i.cur::after{content:'';position:absolute;inset:0;width:var(--p);background:#a99ffa;border-radius:5px}
  .scard p{margin:4px 0;font-size:14px}
  .scard .ph{display:inline-block;margin-top:6px;padding:5px 10px;border-radius:10px;font-size:13px;background:#ffffff10}
  .scard .ph.deep{color:#a99ffa}
  .scard .ph.light{color:var(--warn)}
  .scard small{display:block;color:var(--mut);font-size:12px;margin-top:8px}
  .scard.night{background:linear-gradient(160deg,#1d2350,#16182c);border-color:#6c8cf655}
  .nbar{height:10px;border-radius:5px;background:#ffffff14;margin:6px 0 8px;overflow:hidden}
  .scard .nh{margin:14px 0 2px;font-size:13px;color:#a9b8ff;font-weight:600}
  .nbar i{display:block;height:100%;background:linear-gradient(90deg,#6c8cf6,#a99ffa);border-radius:5px}
  .scard .lnk{display:block;background:none;color:#a9b8ff;font-size:13px;padding:8px 0 0;text-decoration:underline}
  .nlist .it .h{width:118px}
  code.fam{font-size:18px;letter-spacing:1px;color:var(--ok)}
  #toast{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);max-width:496px;margin:0 auto;background:#3a3550;border-radius:16px;
         padding:12px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:0 8px 24px #0008;font-size:15px;z-index:9}
  #toast span{flex:1;min-width:140px}
  #toast button{background:#ffffff18;border-radius:10px;padding:8px 10px;font-size:14px}
  .sheet-bg{position:fixed;inset:0;background:#0009;z-index:8;display:flex;align-items:flex-end}
  .sheet{background:var(--card);width:100%;max-width:520px;margin:0 auto;border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 14px);max-height:92vh;overflow:auto}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .seg button{background:var(--card2);border-radius:14px;padding:14px;font-size:17px}
  .seg button.sel{background:var(--acc);color:#111;font-weight:600}
  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .chips button{background:var(--card2);border-radius:14px;padding:16px 4px;font-size:18px;font-weight:600}
  .chips button small{display:block;font-size:11px;font-weight:400;color:var(--mut)}
  .chips button:active{background:var(--ok);color:#111}
  .banner{display:flex;flex-direction:column;gap:10px;background:#2d2a40;border:1px solid var(--ok);border-radius:16px;padding:12px;margin-top:12px}
  .banner span{font-size:14px}
  .banner b{font-size:24px;font-variant-numeric:tabular-nums}
  .banner.paused{border-color:var(--warn)}
  .bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bgrid button{background:var(--card2);border-radius:12px;padding:13px 8px;font-size:15px}
  .bgrid .stop{background:var(--ok);color:#111;font-weight:600}
  .resume{width:100%;background:#2d2a40;border:1px solid var(--ok);border-radius:16px;padding:14px;font-size:16px;margin-bottom:12px;text-align:left}
  .resume small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
  .wbell{background:var(--card2);border-radius:12px;padding:7px 10px;font-size:13px;min-height:0;white-space:nowrap;color:var(--tx)}
  .wbell.on{background:#2e5a43;color:#c9f5dc}
  .bellyrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .bellybtn{width:100%;background:var(--card);border-radius:16px;padding:11px;font-size:14.5px;color:var(--tx)}
  .bellybtn:active{background:var(--card2)}
  .daybtn{width:100%;margin-top:12px;background:var(--card);border-radius:16px;padding:15px;font-size:15px}
  #day{position:fixed;inset:0;background:var(--bg);z-index:7;overflow:auto}
  #day .wrap{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px 60px}
  .dnav{display:flex;align-items:center;gap:8px}
  .dnav h2{flex:1;text-align:center;font-size:17px;margin:0}
  .dnav button:disabled{opacity:.3}
  .tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .tot button{background:var(--card);border-radius:14px;padding:10px 6px;text-align:center;position:relative}
  .tot button:active{background:var(--card2)}
  .tot button::after{content:'›';position:absolute;right:8px;top:6px;color:var(--mut);font-size:14px}
  .sstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 12px}
  .sstats div{background:var(--card2);border-radius:12px;padding:10px}
  .sstats b{display:block;font-size:17px}
  .sstats small{color:var(--mut);font-size:12px}
  .tot b{display:block;font-size:17px}
  .tot small{color:var(--mut);font-size:12px}
  .tl{position:relative;margin:18px 0 4px}
  .lanelbl{font-size:11px;color:var(--mut);margin:0 0 3px}
  .lane{position:relative;height:28px;background:var(--card);border-radius:8px;margin-bottom:8px;overflow:hidden}
  .lane i{position:absolute;top:0;bottom:0;border-radius:3px}
  .lane .sl{background:#7b6cf6}
  .lane .aw{background:#ffd27a2e}
  .lane .fb{background:var(--acc);min-width:3px}
  .lane .fo{background:#ffb3cf;min-width:3px}
  .lane{cursor:pointer}
  .lane i.sel{box-shadow:inset 0 0 0 2px #fff;z-index:2}
  .lane .mk.sel{outline:none;filter:drop-shadow(0 0 4px #fff);font-size:18px;top:3px}
  .dtip{background:var(--card2);border-radius:12px;padding:10px 12px;margin:4px 0 8px;font-size:14px;min-height:44px}
  .dtip b{display:block;font-size:15px;margin-bottom:2px}
  .dtip span{color:var(--mut);font-size:13px}
  .dtip .why{margin:0}
  .lane .mk{position:absolute;top:5px;font-size:14px;transform:translateX(-50%);font-style:normal;line-height:1}
  .hours{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut)}
  .nowline{position:absolute;top:14px;bottom:16px;width:2px;background:#ffffffaa;z-index:1}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--mut);margin:8px 0 4px}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}
  .list .it{display:flex;gap:10px;padding:10px 0;border-top:1px solid #ffffff10;font-size:14px}
  .list .it .h{width:104px;color:var(--mut);font-variant-numeric:tabular-nums;flex-shrink:0;font-size:13px}
  .list .it .by{display:block;color:var(--mut);font-size:12px}
  .dpa{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .dpa button{padding:6px 10px;font-size:13px;border-radius:10px;min-height:0;background:var(--card2);color:var(--tx);border:1px solid #ffffff22}
  .dpa button.on{background:var(--acc);color:#1a1a1a}
  .dpa button.del.armed{background:#e5484d;color:#fff}
  #tour{position:fixed;inset:0;z-index:20}
  #tour .spot{position:fixed;border-radius:18px;box-shadow:0 0 0 9999px rgba(10,8,16,.8);transition:all .25s ease;pointer-events:none}
  #tour .bubble{position:fixed;left:16px;right:16px;max-width:488px;margin:0 auto;background:#fff;color:#1b1726;border-radius:18px;padding:16px;box-shadow:0 10px 30px #0009}
  #tour .bubble p{margin:0 0 14px;font-size:16px;line-height:1.45}
  #tour .bubble::after{content:"";position:absolute;left:var(--ax,50%);width:16px;height:16px;background:#fff;transform:translateX(-50%) rotate(45deg)}
  #tour .bubble.up::after{top:-7px}
  #tour .bubble.down::after{bottom:-7px}
  #tour .bubble.center{top:50%!important;transform:translateY(-50%)}
  #tour .bubble.center::after{display:none}
  .tnav{display:flex;align-items:center;gap:6px}
  .tdots{flex:1;display:flex;gap:5px}
  .tdots i{width:7px;height:7px;border-radius:50%;background:#d8d2e4}
  .tdots i.on{background:#c45ad8}
  .tskip{background:none;color:#7a7390!important;padding:10px;font-size:15px}
  .tnext{background:linear-gradient(160deg,#ff7aa8,#c45ad8);color:#fff!important;border-radius:12px;padding:11px 18px;font-weight:600;font-size:15px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <!-- Pantalla de configuración (solo la primera vez, si hay Firebase) -->
  <section id="setup" hidden>
    <h1>¿Qué tiene? 👶</h1>
    <p class="why">Una sola vez: así todos los que la cuidan ven lo mismo.</p>
    <div class="card">
      <h3 style="margin-top:0">¿Quién eres?</h3>
      <input type="text" id="nameIn" placeholder="Ej: Mamá, Abuela, Tía Ana" maxlength="20" autocomplete="off">
      <div id="joinBox">
        <h3>Código de familia</h3>
        <input type="text" id="codeIn" placeholder="Ej: K7P3-Q9XD-M2RT" autocomplete="off" autocapitalize="characters">
        <button class="big" id="joinBtn">Unirme</button>
      </div>
      <p class="or">— o, si eres la primera persona —</p>
      <button class="big alt" id="createBtn">Crear familia nueva</button>
    </div>
  </section>

  <section id="app" hidden>
    <header>
      <h1>¿Qué tiene?</h1>
      <span class="sync"><span class="wx" id="wx"></span> <span id="sync"></span></span>
      <button class="icon-btn" id="menuBtn" aria-label="Menú">⋯</button>
    </header>
    <button class="age" id="ageBtn" hidden></button>
    <p class="motto" id="motto"></p>

    <div id="feedBanner"></div>
    <section class="status" id="status"></section>
    <section id="sleepCard"></section>
    <section id="spurt"></section>

    <button class="cry" id="cryBtn">
      <span id="cryTxt">Está llorando</span>
      <small id="crySub">Toca y acerca el celular</small>
      <span class="bar" id="bar"></span>
    </button>
    <button class="skip" id="skipBtn" hidden>Saltar grabación</button>

    <section id="result" class="card" hidden></section>

    <section class="quick">
      <button data-ev="feed">🍼<span>Comió</span></button>
      <button id="sleepBtn">😴<span>Se durmió</span></button>
      <button data-ev="diaper">🧷<span>Pañal</span></button>
    </section>
    <div class="bellyrow"><button class="bellybtn" id="bellyBtn">🎈 Panza durita</button><button class="bellybtn" id="pushBtn">😤 Pujó</button></div>

    <button class="daybtn" id="dayBtn">📊 Resumen y cronograma del día</button>
    <section id="wxAsk"></section>

    <section id="pending"></section>
    <section id="menu" class="card menu" hidden></section>
  </section>
</main>
<div id="sheet" class="sheet-bg" hidden></div>
<section id="day" hidden></section>
<div id="toast" hidden></div>

<script src="firebase-config.js"></script>
<script type="module">
/* ====== Etiquetas ====== */
const LABELS = {
  hambre: { t: 'Hambre',       s: 'Hambre', e: '🍼', tip: 'Ofrécele pecho o tetero.' },
  sueno:  { t: 'Sueño',        s: 'Sueño',  e: '😴', tip: 'Baja luces y ruido, arrúllala o envuélvela.' },
  panal:  { t: 'Pañal',        s: 'Pañal',  e: '🧷', tip: 'Revisa y cambia el pañal.' },
  frio:   { t: 'Frío',         s: 'Frío',   e: '🥶', tip: 'Tócale la nuca o el pecho: si están fríos, ponle una capa más (una más que tú) o una cobija.' },
  calor:  { t: 'Calor',        s: 'Calor',  e: '🥵', tip: 'Si la nuca está sudada o caliente, quítale una capa y ventila el cuarto. Manos y pies fríos son normales.' },
  colico: { t: 'Cólico / gases', s: 'Cólico', e: '😣', tip: 'Barriguita: bicicleta con las piernas, masaje en círculos como las manecillas del reloj, piel con piel o boca abajo sobre tu antebrazo. Si puja (disquecia), dobla sus rodillas hacia la barriga para ayudarla. Vómito verde, sangre en la popó, fiebre o barriga muy hinchada sin querer comer: pediatra.' },
  otro:   { t: 'Otro (brazos, mimos)', s: 'Otro', e: '🫂', tip: 'Cárgala piel con piel, arrúllala o ponle ruido blanco.' }
};
const KEYS = Object.keys(LABELS);
const OLD = { temp: { t: 'Frío / calor', s: 'Temp.', e: '🌡️' } };     // etiqueta de versiones anteriores
const Lb = k => LABELS[k] || OLD[k] || { t: k, s: k, e: '•' };
const REC_SECONDS = 6;
const FB_VERSION = '10.12.2';
const VAPID = window.FIREBASE_VAPID || '';
const CFG = window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey ? window.FIREBASE_CONFIG : null;

const $ = id => document.getElementById(id);
const now = () => Date.now();
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const mins = t => t == null ? null : (now() - t) / 60000;
const clip = (x, a, b) => Math.max(a, Math.min(b, x));
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };

/* ====== Almacenamiento: local o nube (Firebase) ====== */
const LOCAL_KEY = 'llanto.v1';
function loadLocal() {
  try { const d = JSON.parse(lsGet(LOCAL_KEY)); if (d && d.events && d.cries) return d; } catch (e) {}
  return { events: [], cries: [] };
}
let D = loadLocal();
let cloud = null;                 // se llena si hay Firebase + familia
let FAM = lsGet('llanto.fam');
let ME = lsGet('llanto.name') || '';

function saveLocal() { if (!cloud) lsSet(LOCAL_KEY, JSON.stringify(D)); }
const clean = o => JSON.parse(JSON.stringify(o));
function persist(col, obj) { cloud ? cloud.set(col, obj) : saveLocal(); }
function unpersist(col, id) { cloud ? cloud.del(col, id) : saveLocal(); }

function setSync(t) { $('sync').textContent = t; }
window.addEventListener('online', () => cloud && setSync('☁️ en línea'));
window.addEventListener('offline', () => cloud && setSync('📴 sin señal · se sube luego'));

async function initCloud(code) {
  const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
  const [{ initializeApp }, A, F] = await Promise.all([
    import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')
  ]);
  const app = initializeApp(CFG);
  const auth = A.getAuth(app);
  await new Promise(res => { const u = A.onAuthStateChanged(auth, () => { u(); res(); }); });
  if (!auth.currentUser) await A.signInAnonymously(auth);
  let db;
  try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
  catch (e) { db = F.getFirestore(app); }
  const col = n => F.collection(db, 'families', code, n);
  const fail = e => { console.error(e); setSync('⚠️ error al sincronizar'); };
  cloud = {
    set: (n, o) => F.setDoc(F.doc(col(n), o.id), clean(o)).catch(fail),
    del: (n, id) => F.deleteDoc(F.doc(col(n), id)).catch(fail),
    async bulk(n, arr, del = false) {
      for (let i = 0; i < arr.length; i += 400) {
        const b = F.writeBatch(db);
        arr.slice(i, i + 400).forEach(o => del ? b.delete(F.doc(col(n), o.id)) : b.set(F.doc(col(n), o.id), clean(o)));
        await b.commit();
      }
    }
  };
  // Registrarse como miembro de la familia (lo exigen las reglas de seguridad)
  const MY = auth.currentUser.uid;
  const myDoc = F.doc(db, 'families', code, 'members', MY);
  const famDoc = F.doc(db, 'families', code);
  const member = F.setDoc(myDoc, { name: ME, t: now(), seen: now(), on: !document.hidden }, { merge: true });
  await Promise.race([member, new Promise(r => setTimeout(r, 5000))]).catch(fail);
  cloud.uid = MY;
  cloud.owner = undefined;          // undefined = aún no se sabe · null = sin administradora
  // Presencia: avisa que está en la app al abrir, cada minuto mientras esté abierta y al salir
  const ping = on => F.setDoc(myDoc, { name: ME, seen: now(), on }, { merge: true }).catch(() => {});
  setInterval(() => { if (!document.hidden) ping(true); }, 60000);
  document.addEventListener('visibilitychange', () => ping(!document.hidden));
  window.addEventListener('pagehide', () => ping(false));
  // Quién es la administradora (la mamá)
  const watchFam = (tries = 0) => F.onSnapshot(famDoc,
    snap => {
      cloud.owner = snap.exists() ? snap.data().owner : null;
      if (cloud.owner === MY && lsGet('llanto.notif') === '1' && 'Notification' in window && Notification.permission === 'granted' && !cloud._tkDone) {
        cloud._tkDone = true; cloud.notifToken().catch(console.error);
      }
    },
    err => { console.error(err); if (tries < 5) setTimeout(() => watchFam(tries + 1), 4000); });
  watchFam();
  // Nombre y fecha de nacimiento de la bebé (documento fijo, t:0 para que no entre en la lista de eventos)
  const watchBaby = (tries = 0) => F.onSnapshot(F.doc(col('events'), 'baby'),
    snap => { if (snap.exists()) { BABY = snap.data(); lsSet('llanto.baby', JSON.stringify(BABY)); } renderAge(); },
    err => { console.error(err); if (tries < 5) setTimeout(() => watchBaby(tries + 1), 4000); });
  watchBaby();
  cloud.claim = () => F.setDoc(famDoc, { owner: MY, t: now() });
  // Notificaciones (solo la administradora): guarda el token de este celular en su registro
  cloud.notifToken = async () => {
    const M = await import(base + 'firebase-messaging.js');
    if (!(await M.isSupported())) throw new Error('unsupported');
    const reg = await navigator.serviceWorker.ready;
    const tk = await M.getToken(M.getMessaging(app), { vapidKey: VAPID, serviceWorkerRegistration: reg });
    if (!tk) throw new Error('no-token');
    await F.setDoc(myDoc, { fcm: tk, notif: true }, { merge: true });
    return tk;
  };
  cloud.notifOff = () => F.setDoc(myDoc, { notif: false }, { merge: true });
  cloud.setWatch = names => F.setDoc(myDoc, { watch: names }, { merge: true });
  cloud.watchMembers = (cb, onErr) => F.onSnapshot(F.collection(db, 'families', code, 'members'),
    snap => cb(snap.docs.map(d => ({ id: d.id, ...d.data() }))), onErr);
  const since = now() - 120 * 864e5;
  const listen = (n, tries = 0) => F.onSnapshot(
    F.query(col(n), F.where('t', '>=', since)),
    snap => { D[n] = snap.docs.map(d => d.data()); setSync(navigator.onLine ? '☁️ en línea' : '📴 sin señal · se sube luego'); render(); },
    err => { fail(err); if (tries < 5) setTimeout(() => listen(n, tries + 1), 4000); }
  );
  D = { events: [], cries: [] };
  listen('events'); listen('cries');
}

/* ====== Eventos ====== */
function addEvent(type, t = now(), extra = {}) { const e = { id: uid(), type, t, by: ME, ...extra }; D.events.push(e); persist('events', e); return e; }
function removeEvent(id) { D.events = D.events.filter(e => e.id !== id); unpersist('events', id); }
function shiftEvent(id, minutes) {
  const e = D.events.find(x => x.id === id); if (!e) return;
  e.t -= minutes * 60000; persist('events', e);
}
function last(types) {
  types = [].concat(types); let r = null;
  for (const e of D.events) if (types.includes(e.type) && (!r || e.t > r.t)) r = e;
  return r;
}
function median(a) {
  if (!a.length) return null;
  a = [...a].sort((x, y) => x - y); const m = a.length >> 1;
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}
/* Ritmos aprendidos de ella */
function feedInterval() {
  const f = D.events.filter(e => e.type === 'feed').map(e => e.t).sort((a, b) => a - b), d = [];
  for (let i = 1; i < f.length; i++) { const x = (f[i] - f[i - 1]) / 60000; if (x >= 30 && x <= 360) d.push(x); }
  return median(d.slice(-15)) || 180;
}
function wakeWindow() {
  const ev = D.events.filter(e => e.type === 'sleep' || e.type === 'wake').sort((a, b) => a.t - b.t), d = [];
  for (let i = 1; i < ev.length; i++)
    if (ev[i - 1].type === 'wake' && ev[i].type === 'sleep') { const x = (ev[i].t - ev[i - 1].t) / 60000; if (x >= 20 && x <= 240) d.push(x); }
  return median(d.slice(-15)) || 80;
}
function asleep() { const l = last(['sleep', 'wake']); return !!l && l.type === 'sleep'; }
function getCtx() {
  const f = last('feed'), dp = last('diaper'), sw = last(['sleep', 'wake']), d = new Date();
  return {
    sinceFeed: f ? mins(f.t) : null,
    awake: sw ? (sw.type === 'wake' ? mins(sw.t) : 0) : null,
    sinceDiaper: dp ? mins(dp.t) : null,
    sinceBelly: (() => { const b = last('belly'); return b ? mins(b.t) : null; })(),
    sincePush: (() => { const b = last('push'); return b ? mins(b.t) : null; })(),
    sincePoop: (() => { const pp = D.events.filter(e => e.type === 'diaper' && e.poop).sort((a, b) => b.t - a.t)[0]; return pp ? mins(pp.t) : null; })(),
    hour: d.getHours() + d.getMinutes() / 60,
    feedInt: feedInterval(), wakeWin: wakeWindow(),
    tOut: outsideTemp()
  };
}

/* ====== Predicción ====== */
/* Cada cuánto le cambian el pañal normalmente: mediana de los últimos 15 intervalos (de 45 min a 8 h).
   Mientras no haya suficientes registros, 3 h. */
function diaperInt() {
  const ts = D.events.filter(e => e.type === 'diaper').map(e => e.t).sort((a, b) => a - b), g = [];
  for (let i = 1; i < ts.length; i++) { const x = (ts[i] - ts[i - 1]) / 60000; if (x >= 45 && x <= 480) g.push(x); }
  const r = g.slice(-15).sort((a, b) => a - b);
  if (r.length < 5) return 180;
  const m = r.length >> 1, med = r.length % 2 ? r[m] : (r[m - 1] + r[m]) / 2;
  return Math.max(90, Math.min(360, med));
}
const sig = (x, mid, w) => 1 / (1 + Math.exp(-(x - mid) / w));
function normP(s) { const t = KEYS.reduce((a, k) => a + s[k], 0) || 1, o = {}; KEYS.forEach(k => o[k] = s[k] / t); return o; }
function prior(c) {
  return normP({
    hambre: c.sinceFeed == null ? 0.35 : 0.05 + 0.9 * sig(c.sinceFeed, c.feedInt * 0.85, 15),
    sueno:  c.awake == null ? 0.3 : 0.05 + 0.85 * sig(c.awake, c.wakeWin * 0.9, 12),
    panal:  c.sinceDiaper == null ? 0.3 : 0.05 + 0.7 * sig(c.sinceDiaper, diaperInt(), diaperInt() / 6),
    ...tempPrior(c),
    colico: colicPrior(c),
    otro: 0.12
  });
}
function tempPrior(c) {
  if (c.tOut != null) return {                       // con clima de afuera
    frio:  0.03 + 0.17 * sig(16 - c.tOut, 0, 2),
    calor: 0.03 + 0.17 * sig(c.tOut - 26, 0, 2)
  };
  const night = c.hour < 6 || c.hour >= 22, afternoon = c.hour >= 12 && c.hour < 17;
  return { frio: night ? 0.09 : 0.05, calor: afternoon ? 0.08 : 0.05 };
}
// Cólico/gases/disquecia: más típico al final de la tarde/noche, un rato después de comer y si lleva mucho sin hacer popó
function colicPrior(c) {
  let p = 0.05;
  if (c.hour >= 17 && c.hour < 23) p += 0.06;
  if (c.sinceFeed != null && c.sinceFeed >= 10 && c.sinceFeed <= 75) p += 0.06;
  if (c.sinceBelly != null && c.sinceBelly <= 120) p += 0.10;              // le sintieron la panza durita hace poco
  if (c.sincePush != null && c.sincePush <= 60) p += 0.10;                 // está pujando (gases / disquecia)
  if (c.sincePoop != null) p += 0.12 * sig(c.sincePoop, 24 * 60, 120);
  return p;
}
const CTX_DIMS = 7;
function ctxVec(c) {
  return [
    clip(c.sinceFeed == null ? 1 : c.sinceFeed / c.feedInt, 0, 3),
    clip(c.awake == null ? 1 : c.awake / c.wakeWin, 0, 3),
    clip(c.sinceDiaper == null ? 1 : c.sinceDiaper / 180, 0, 3),
    Math.sin(2 * Math.PI * c.hour / 24), Math.cos(2 * Math.PI * c.hour / 24),
    c.tOut == null ? 0 : clip((c.tOut - 20) / 5, -3, 3),
    c.sincePoop == null ? 0.5 : clip(c.sincePoop / 1440, 0, 3)
  ];
}
function knn(cur) {
  const useAudio = !!cur.audio;
  const train = D.cries.filter(c => c.label && LABELS[c.label] && c.id !== cur.id && (!useAudio || (c.audio && c.audio.length === cur.audio.length)));
  if (train.length < 3) return null;
  const vec = c => useAudio ? ctxVec(c.ctx).concat(c.audio) : ctxVec(c.ctx);
  const X = train.map(vec), q = vec(cur), dim = q.length;
  const mean = Array(dim).fill(0), sd = Array(dim).fill(0);
  X.forEach(v => v.forEach((x, i) => mean[i] += x / X.length));
  X.forEach(v => v.forEach((x, i) => sd[i] += (x - mean[i]) ** 2 / X.length));
  for (let i = 0; i < dim; i++) sd[i] = Math.max(Math.sqrt(sd[i]), 0.05);
  const wDim = i => i < CTX_DIMS ? 1 : 0.6;
  const dist = v => Math.sqrt(v.reduce((a, x, i) => a + wDim(i) * ((x - q[i]) / sd[i]) ** 2, 0));
  const nb = train.map((c, i) => ({ l: c.label, d: dist(X[i]) })).sort((a, b) => a.d - b.d).slice(0, Math.min(7, train.length));
  const s = {}; KEYS.forEach(k => s[k] = 0.2);
  nb.forEach(n => s[n.l] += 1 / (n.d + 0.3));
  return { p: normP(s), n: train.length };
}
function predict(cur) {
  const p = prior(cur.ctx), r = knn(cur);
  if (!r) return { p, w: 0 };
  const w = Math.min(0.85, r.n / 40), o = {};
  KEYS.forEach(k => o[k] = (1 - w) * p[k] + w * r.p[k]);
  return { p: normP(o), w };
}
const topOf = p => KEYS.slice().sort((a, b) => (p[b] || 0) - (p[a] || 0))[0];

/* ====== Audio (se analiza en el celular, nunca se sube) ====== */
function frameFeatures(td, fd, sr, N) {
  let e = 0; for (let i = 0; i < N; i++) e += td[i] * td[i];
  const rms = Math.sqrt(e / N);
  const binHz = sr / N, bands = [500, 1000, 2000, 4000, 8000], be = [0, 0, 0, 0, 0];
  let tot = 0, cen = 0; const pw = new Float32Array(fd.length);
  for (let i = 1; i < fd.length; i++) {
    const f = i * binHz; if (f > 8000) break;
    const p = Math.pow(10, fd[i] / 10); pw[i] = p; tot += p; cen += f * p;
    for (let b = 0; b < 5; b++) if (f < bands[b]) { be[b] += p; break; }
  }
  let roll = 0, acc = 0;
  for (let i = 1; i < pw.length; i++) { acc += pw[i]; if (acc >= 0.85 * tot) { roll = i * binHz; break; } }
  let pitch = 0;
  if (rms > 0.01) {
    const minL = Math.floor(sr / 1000), maxL = Math.ceil(sr / 200), M = N - maxL;
    let r0 = 0; for (let i = 0; i < M; i++) r0 += td[i] * td[i];
    let best = 0, bl = 0;
    for (let l = minL; l <= maxL; l++) {
      let r = 0; for (let i = 0; i < M; i++) r += td[i] * td[i + l];
      r /= (r0 || 1); if (r > best) { best = r; bl = l; }
    }
    if (best > 0.5) pitch = sr / bl;
  }
  return { rms, cen: tot ? cen / tot : 0, roll, be: be.map(x => tot ? x / tot : 0), pitch };
}
function aggregate(F, seconds) {
  if (!F.length) return null;
  const r = F.map(f => f.rms).sort((a, b) => a - b), p95 = r[Math.floor(r.length * 0.95)];
  if (p95 < 0.015) return null;
  const thr = Math.max(0.01, 0.25 * p95), A = F.filter(f => f.rms > thr);
  if (A.length < 4) return null;
  let bursts = 0; for (let i = 1; i < F.length; i++) if (F[i].rms > thr && F[i - 1].rms <= thr) bursts++;
  const m = a => a.reduce((x, y) => x + y, 0) / (a.length || 1);
  const s = a => { const mu = m(a); return Math.sqrt(m(a.map(x => (x - mu) ** 2))); };
  const rmsA = A.map(f => f.rms), cen = A.map(f => f.cen / 1000), voiced = A.filter(f => f.pitch > 0), pit = voiced.map(f => f.pitch / 1000);
  return [
    A.length / F.length, bursts / seconds, Math.log10(m(rmsA) + 1e-4), s(rmsA) / (m(rmsA) || 1),
    m(cen), s(cen), m(A.map(f => f.roll / 1000)),
    ...[0, 1, 2, 3, 4].map(b => m(A.map(f => f.be[b]))),
    voiced.length / A.length, pit.length ? m(pit) : 0, pit.length ? s(pit) : 0
  ].map(x => Number.isFinite(x) ? +x.toFixed(4) : 0);
}
let rec = null;
async function recordFeatures(seconds, onTick) {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  try { await ac.resume(); } catch (e) {}
  const src = ac.createMediaStreamSource(stream), an = ac.createAnalyser();
  an.fftSize = 2048; an.smoothingTimeConstant = 0; src.connect(an);
  const sr = ac.sampleRate, N = an.fftSize, td = new Float32Array(N), fd = new Float32Array(an.frequencyBinCount);
  const F = [], start = performance.now();
  rec = { stop: false };
  await new Promise(res => {
    const iv = setInterval(() => {
      an.getFloatTimeDomainData(td); an.getFloatFrequencyData(fd);
      F.push(frameFeatures(td, fd, sr, N));
      const el = (performance.now() - start) / 1000;
      onTick(el / seconds, el);
      if (el >= seconds || rec.stop) { clearInterval(iv); res(); }
    }, 50);
  });
  const skipped = rec.stop; rec = null;
  stream.getTracks().forEach(t => t.stop()); try { ac.close(); } catch (e) {}
  return skipped ? { skipped: true } : { audio: aggregate(F, seconds) };
}

/* ====== Clima de afuera (Open-Meteo, gratis y sin cuenta) ======
   La ubicación se redondea (~1 km), se queda en este celular y solo se usa para pedir la temperatura. */
const WX_LOC = 'llanto.wxLoc', WX_DATA = 'llanto.wx';
function outsideTemp() {
  try { const w = JSON.parse(lsGet(WX_DATA)); if (w && now() - w.t < 90 * 60000) return w.temp; } catch (e) {}
  return null;
}
async function refreshWeather(force) {
  let loc; try { loc = JSON.parse(lsGet(WX_LOC)); } catch (e) {}
  if (!loc) return null;
  try { const w = JSON.parse(lsGet(WX_DATA)); if (!force && w && now() - w.t < 30 * 60000) { showWx(); return w.temp; } } catch (e) {}
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m`);
    const j = await r.json(), temp = j && j.current && j.current.temperature_2m;
    if (typeof temp === 'number') { lsSet(WX_DATA, JSON.stringify({ t: now(), temp })); showWx(); return temp; }
  } catch (e) {}
  return null;
}
function showWx() { const t = outsideTemp(); $('wx').textContent = t == null ? '' : `🌡️ ${Math.round(t)}° afuera`; }
function enableWeather() {
  return new Promise(res => {
    if (!navigator.geolocation) { toast('Este celular no permite ubicación'); return res(false); }
    navigator.geolocation.getCurrentPosition(async p => {
      lsSet(WX_LOC, JSON.stringify({ lat: +p.coords.latitude.toFixed(2), lon: +p.coords.longitude.toFixed(2) }));
      lsSet('llanto.wxAsk', '1');
      const t = await refreshWeather(true);
      toast(t != null ? `🌡️ Listo: afuera hay ${Math.round(t)} °C` : 'Ubicación guardada; el clima se cargará con internet');
      render(); res(true);
    }, () => { toast('Sin permiso de ubicación: sigo sin clima. Puedes activarlo en el menú.'); lsSet('llanto.wxAsk', '1'); render(); res(false); },
    { enableHighAccuracy: false, timeout: 15000, maximumAge: 6 * 3600e3 });
  });
}
function disableWeather() { lsSet(WX_LOC, null); lsSet(WX_DATA, null); showWx(); }
function renderWxAsk() {
  const el = $('wxAsk');
  if (lsGet('llanto.wxAsk') || lsGet(WX_LOC)) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="card"><p style="margin:0 0 10px">🌡️ <b>¿Uso el clima de afuera?</b> Ayuda a saber si llora por frío o por calor (por ejemplo, en madrugadas frías). Tu ubicación se queda en este celular.</p>
    <div class="row" style="margin-top:0"><button id="wxYes" style="background:var(--ok);color:#111;font-weight:600">Activar</button><button id="wxNo">Ahora no</button></div></div>`;
  $('wxYes').onclick = enableWeather;
  $('wxNo').onclick = () => { lsSet('llanto.wxAsk', '1'); renderWxAsk(); };
}
setInterval(() => refreshWeather(false), 10 * 60000);

/* ====== Formato ====== */
function fmt(m) {
  if (m == null) return '—';
  m = Math.round(m); if (m < 60) return m + ' min';
  return Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0');
}
const hhmm = t => { const d = new Date(t), h = d.getHours(); return `${h % 12 || 12}:${String(d.getMinutes()).padStart(2, '0')} ${h < 12 ? 'am' : 'pm'}`; };
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function why(k, c) {
  if (k === 'hambre') return c.sinceFeed == null ? 'Aún no hay tomas registradas' : `Comió hace ${fmt(c.sinceFeed)} · suele comer cada ${fmt(c.feedInt)}`;
  if (k === 'sueno') return c.awake == null ? 'Aún no hay sueño registrado' : (c.awake === 0 ? 'Estaba dormida' : `Lleva ${fmt(c.awake)} despierta · aguanta ~${fmt(c.wakeWin)}`);
  if (k === 'panal') return c.sinceDiaper == null ? 'Aún no hay pañales registrados' : `Último pañal hace ${fmt(c.sinceDiaper)} · suelen cambiarla cada ~${fmt(diaperInt())}`;
  if (k === 'colico') {
    const r = [];
    if (c.sincePush != null && c.sincePush <= 60) r.push(`pujó hace ${fmt(c.sincePush)}`);
    if (c.sinceBelly != null && c.sinceBelly <= 120) r.push(`panza durita hace ${fmt(c.sinceBelly)}`);
    if (c.sinceFeed != null && c.sinceFeed >= 10 && c.sinceFeed <= 75) r.push(`comió hace ${fmt(c.sinceFeed)}`);
    if (c.sincePoop != null) r.push(`última popó hace ${fmt(c.sincePoop)}`);
    if (c.hour >= 17 && c.hour < 23) r.push('es la hora típica de cólicos');
    return r.length ? r.join(' · ').replace(/^./, x => x.toUpperCase()) : 'Por cómo suena y su historial';
  }
  if (k === 'frio' || k === 'calor') {
    const h = c.hour < 6 ? ' · es de madrugada' : (c.hour >= 12 && c.hour < 17 ? ' · es la hora más caliente' : '');
    return c.tOut != null ? `Afuera hay ${Math.round(c.tOut)} °C${h}` : `Sin dato del clima${h}`;
  }
  return 'Sus horarios no explican bien este llanto';
}

/* ====== Pantalla ====== */
let currentCryId = null;
function render() {
  if ($('app').hidden) return;
  const c = getCtx();
  const by = (e, detail = '') => {
    const parts = [detail, cloud && e && e.by ? e.by : ''].filter(Boolean);
    return parts.length ? `<em>${esc(parts.join(' · '))}</em>` : '';
  };
  const chip = (lab, v, alert, e, detail) => `<div class="chip ${alert ? 'alert' : ''}"><b>${fmt(v)}</b><small>${lab}</small>${by(e, detail)}</div>`;
  const ls = last('sleep'), lf = last('feed');

  if (s != null) raw.push({ a: s.t, b: now(), by: s.by, on: true });

      out.push({ a: cur.a, b: f.a, by: cur.by });

    stats = st(R.breastMin + ' min', 'en total') + st(sel.length, 'tomas de pecho')
      + st(sel.length ? Math.round(R.breastMin / sel.length) + ' min' : '—', 'promedio por toma')

    : k === done && curN <= shown ? `<i class="cur" style="--p:${Math.round(frac * 100)}%"></i>` : '<i></i>').join('');
  const status = done === 0
    ? `En su <b>primer ciclo</b> · le faltan <b>${left} min</b> para completarlo`
    : `<b>${done} ${done === 1 ? 'ciclo completo' : 'ciclos completos'}</b> · va en el ${curN}.º y le faltan <b>${left} min</b>`;
  const phase = frac < 0.22 ? `<span class="ph">🌙 Quedándose dormida · si se mueve o se queja, espera un poco</span>`
    : frac < 0.67 ? `<span class="ph deep">💤 Sueño profundo · buen momento para pasarla a la cuna</span>`
    : `<span class="ph light">🌤️ Sueño ligero · puede despertarse al final del ciclo</span>`;
  return { len, m, frac, dots, status, phase };
}
function cycleNote(len) {
  const age = BABY && BABY.birth ? ageParts(BABY.birth) : null;
  return `<small>A ${age ? `su edad (${age.m} ${age.m === 1 ? 'mes' : 'meses'})` : 'esta edad'} cada ciclo dura unos <b>${len} min</b>. Al terminar uno, se vuelve a dormir o se despierta. Es un promedio: cada bebé es distinto.${age ? '' : ' Pon la fecha de nacimiento arriba para ajustarlo.'}</small>`;
}
function renderSleepCard() {
  const el = $('sleepCard'); let ls = last(['sleep', 'wake']);
  if (!ls || ls.type !== 'sleep') { el.innerHTML = ''; return; }
  const curSp = sleepSpans().filter(x => x.on).pop();          // si comió en medio, el sueño actual empieza después de la toma
  if (curSp && curSp.a !== ls.t) ls = { ...ls, t: curSp.a };
  const h = hourOf(ls.t);
  if (h >= NIGHT_FROM && h < NIGHT_TO && isNight(ls.t)) { renderNightCard(el, ls); return; }
  const tr = tramoOf(ls.t);
  if (tr && tr.i > 1) { renderNightTramo(el, ls, tr); return; }
  if (h >= NIGHT_FROM && h < NIGHT_TO && !tr) { renderNightCard(el, ls); return; }
  const { len, m, dots, status, phase } = cycleInfo(ls);
  el.innerHTML = `<div class="scard">
    <div class="top"><b>😴 Dormida ${fmt(m)}</b><span>desde ${hhmm(ls.t)}</span></div>
    <div class="cyc">${dots}</div>
    <p>${status}</p>
    ${phase}
    ${cycleNote(len)}
  </div>`;
}

/* ====== Quién está en línea (solo la administradora) ====== */
const ONLINE_MS = 2.5 * 60000;
function agoTxt(t) {
  const m = (now() - t) / 60000;
  if (m < 1) return 'hace un momento';
  if (m < 60) return `hace ${Math.round(m)} min`;
  if (m < 24 * 60) return `hace ${fmt(m)}`;
  const d = Math.floor(m / 1440);
  return d === 1 ? 'ayer' : `hace ${d} días`;
}
function whenTxt(t) {
  const d = new Date(t), t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const day = d >= t0 ? 'hoy' : d >= t0 - 864e5 ? 'ayer' : d.toLocaleDateString('es-CO', { day: 'numeric', month: 'short' });
  return `${day} ${hhmm(t)}`;
}
function openWho() {
  const sh = $('sheet');
  let list = [], unsub = null, tick = null, watch = [];
  const close = () => { if (unsub) unsub(); clearInterval(tick); sh.hidden = true; sh.innerHTML = ''; };
  const draw = () => {
    const rows = list.map(x => ({ ...x, seen: x.seen || x.t || 0 }))
      .map(x => ({ ...x, online: x.on !== false && now() - x.seen < ONLINE_MS }))
      .sort((a, b) => (b.online - a.online) || (b.seen - a.seen));
    const n = rows.filter(x => x.online).length;
    sh.innerHTML = `<div class="sheet">
      <h3 style="margin-top:0">🟢 Quién está en línea</h3>
      <p class="note" style="margin-top:0">${n ? `${n} ${n === 1 ? 'persona' : 'personas'} con la app abierta ahora` : 'Nadie más tiene la app abierta ahora'}</p>
      ${rows.length ? rows.map(x => { const key = String(x.name || '').trim().toLowerCase(), on = watch.includes(key);
        return `<div class="who"><i class="dot ${x.online ? 'on' : ''}"></i><div style="flex:1">
        <b>${esc(x.name || 'Sin nombre')}${x.id === cloud.uid ? ' (tú)' : ''}</b>
        <small>${x.online ? '<span class="on-t">En línea ahora</span>' : x.seen ? `Entró ${agoTxt(x.seen)} · ${whenTxt(x.seen)}` : 'Aún no ha entrado'}</small>
      </div>${x.id !== cloud.uid && key ? `<button class="wbell ${on ? 'on' : ''}" data-w="${esc(key)}">${on ? '🔔 Te aviso' : '🔕 Avisarme'}</button>` : ''}</div>`; }).join('') : '<p class="note">Cargando…</p>'}
      <p class="note">Solo tú ves esta lista. Con <b>🔔</b> te llega una notificación cada vez que esa persona abre la app (puede tardar hasta 10 min). Si alguien aparece dos veces es porque entró desde otro celular o navegador.</p>
      <button class="later" id="whoClose">Cerrar</button></div>`;
    $('whoClose').onclick = close;
    sh.querySelectorAll('[data-w]').forEach(b => b.onclick = async () => {
      const k = b.dataset.w, nw = watch.includes(k) ? watch.filter(x => x !== k) : [...watch, k];
      try { await cloud.setWatch(nw); watch = nw; draw(); toast(nw.includes(k) ? '🔔 Te aviso cuando entre' : 'Ya no te aviso'); }
      catch (e) { console.error(e); toast('No pude guardarlo, intenta de nuevo'); }
    });
  };
  sh.onclick = e => { if (e.target === sh) close(); };
  sh.hidden = false; draw();
  unsub = cloud.watchMembers(a => { list = a; const mine = a.find(x => x.id === cloud.uid); if (mine && Array.isArray(mine.watch)) watch = mine.watch; draw(); }, err => { console.error(err); close(); toast('No pude ver la lista. Revisa que publicaste las reglas nuevas.'); });
  tick = setInterval(draw, 30000);
}

/* ====== Botón atrás del celular ======
   Cada ventana que se abre (resumen, hojas de abajo, menú) agrega un paso al historial,
   así el botón atrás la cierra en vez de salir de la app. */
(() => {
  const IDS = ['day', 'sheet', 'menu'], stack = [];
  let pushed = 0, busy = false;
  const sync = () => {
    if (busy) return;
    if (pushed < stack.length) { history.pushState({ ov: stack.length }, ''); pushed++; sync(); }
    else if (pushed > stack.length) { busy = true; pushed--; history.back(); }
  };
  const closeOv = id => {
    const el = $(id); if (!el || el.hidden) return;
    if (id === 'day' && $('dClose')) $('dClose').click();
    else if (id === 'sheet') el.dispatchEvent(new MouseEvent('click', { bubbles: true }));   // cierra con su propia limpieza
    if (!el.hidden) { el.hidden = true; if (id === 'sheet') el.innerHTML = ''; }
  };
  new MutationObserver(() => {
    for (const id of IDS) {
      const vis = !$(id).hidden, i = stack.indexOf(id);
      if (vis && i < 0) stack.push(id);
      if (!vis && i >= 0) stack.splice(i, 1);
    }
    sync();
  }).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden'] });
  addEventListener('popstate', () => {
    if (busy) { busy = false; sync(); return; }
    pushed = Math.max(0, pushed - 1);
    const top = stack[stack.length - 1];
    if (top) { stack.pop(); closeOv(top); }
    sync();
  });
})();

/* ====== Arranque ====== */
function genCode() {
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = new Uint32Array(12);
  crypto.getRandomValues(r);
  const s = Array.from(r, x => A[x % A.length]).join('');
  return `${s.slice(0, 4)}-${s.slice(4, 8)}-${s.slice(8, 12)}`;
}
function showApp() {
  $('setup').hidden = true; $('app').hidden = false; render();
  if (!lsGet('llanto.tour')) setTimeout(startTour, 500);
}

/* ====== Tutorial con globitos (solo la primera vez) ====== */
const TOUR = [
  { t: '👋 <b>¡Bienvenida!</b> Te muestro en 30 segundos cómo funciona la app. Todo se registra con un solo toque.' },
  { el: '#status', t: '<b>De un vistazo:</b> hace cuánto comió, cuánto lleva despierta y cuándo fue el último pañal. Se pone <b style="color:#c99a1a">amarillo</b> cuando ya le toca.' },
  { el: '#cryBtn', t: '<b>Cuando llore,</b> toca aquí y acerca el celular a ella unos segundos. Te digo la causa más probable: hambre, sueño, pañal, frío, calor, cólico/gases u otra.' },
  { el: '[data-ev=feed]', t: '<b>Cuando coma,</b> toca aquí. Eliges <b>pecho</b> (con cronómetro y lado) o <b>tetero</b> (tocas las onzas).' },
  { el: '#sleepBtn', t: '<b>Cuando se duerma</b> toca aquí, y <b>cuando se despierte</b> vuelves a tocar el mismo botón.' },
  { el: '[data-ev=diaper]', t: '<b>Cada cambio de pañal,</b> un toque aquí. Si hubo popó, toca <b>💩 Hubo popó</b> en el aviso de abajo: ayuda a detectar cólicos y estreñimiento. Si se te olvidó, la corriges luego en 📊 Resumen del día → recuadro 🧷 pañales.' },
  { el: '.bellyrow', t: '<b>🎈 Panza durita</b> si se la sientes dura, y <b>😤 Pujó</b> cada vez que la escuches pujar. Así ves a qué horas le pasa y la app lo tiene en cuenta para sugerir cólico o gases.' },
  { el: '#dayBtn', t: '<b>Resumen y cronograma del día:</b> cuántas tomas, cuánto durmió y los pañales. En el cronograma <b>toca cualquier barra o ícono</b> para ver a qué hora fue y cuánto duró. Abajo está todo hora por hora, del más reciente al más temprano, y lo puedes compartir con el pediatra.' },
  { el: '#menuBtn', t: '<b>Menú:</b> invitar a la familia por WhatsApp, lo que la app va aprendiendo, respaldo y ver este tutorial otra vez.' },
  { t: '⭐ <b>Lo más importante:</b> después de que llore, cuando logres calmarla, marca <b>qué funcionó</b>. Con cada respuesta la app aprende a reconocer sus llantos.<br><br>¿Te equivocaste en algo? Siempre aparece <b>Deshacer</b> abajo.' }
];
function startTour() {
  if ($('tour') || $('app').hidden) return;
  $('menu').hidden = true;
  let i = 0;
  const ov = document.createElement('div'); ov.id = 'tour';
  ov.innerHTML = `<div class="spot"></div><div class="bubble"><p></p>
    <div class="tnav"><span class="tdots">${TOUR.map(() => '<i></i>').join('')}</span>
    <button class="tskip">Omitir</button><button class="tnext">Siguiente</button></div></div>`;
  document.body.appendChild(ov);
  const spot = ov.querySelector('.spot'), bub = ov.querySelector('.bubble');
  const end = () => { lsSet('llanto.tour', '1'); ov.remove(); window.removeEventListener('resize', place); };
  function place() {
    const s = TOUR[i], el = s.el ? document.querySelector(s.el) : null, last = i === TOUR.length - 1;
    bub.querySelector('p').innerHTML = s.t;
    ov.querySelectorAll('.tdots i').forEach((d, k) => d.classList.toggle('on', k === i));
    ov.querySelector('.tnext').textContent = last ? '¡Entendido!' : 'Siguiente';
    ov.querySelector('.tskip').style.visibility = last ? 'hidden' : 'visible';
    bub.classList.remove('up', 'down', 'center'); bub.style.top = bub.style.bottom = '';
    if (!el) {
      Object.assign(spot.style, { left: '50%', top: '50%', width: '0', height: '0' });
      bub.classList.add('center'); return;
    }
    el.scrollIntoView({ block: 'center' });
    requestAnimationFrame(() => {
      const r = el.getBoundingClientRect(), pad = 6;
      Object.assign(spot.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px' });
      const below = r.bottom + 200 < innerHeight;
      if (below) { bub.classList.add('up'); bub.style.top = r.bottom + pad + 14 + 'px'; }
      else { bub.classList.add('down'); bub.style.bottom = innerHeight - r.top + pad + 14 + 'px'; }
      const b = bub.getBoundingClientRect();
      bub.style.setProperty('--ax', clip(r.left + r.width / 2 - b.left, 24, b.width - 24) + 'px');
    });
  }
  ov.querySelector('.tnext').onclick = () => { if (i === TOUR.length - 1) end(); else { i++; place(); } };
  ov.querySelector('.tskip').onclick = end;
  window.addEventListener('resize', place);
  place();
}

async function start() {
  if (!CFG) { showApp(); return; }                 // sin Firebase: modo local
  const urlF = new URLSearchParams(location.search).get('f');
  if (FAM && ME && (!urlF || urlF === FAM)) {
    showApp(); setSync('⏳ conectando…');
    try { await initCloud(FAM); } catch (e) { console.error(e); setSync('⚠️ sin conexión a la nube'); }
    return;
  }
  // Configuración inicial
  $('setup').hidden = false;
  $('nameIn').value = ME;
  if (urlF) $('codeIn').value = urlF;
  const go = async (code, uploadLocal) => {
    const name = $('nameIn').value.trim();
    if (!name) { toast('Escribe tu nombre (ej. Mamá)'); $('nameIn').focus(); return; }
    ME = name; FAM = code; lsSet('llanto.name', ME); lsSet('llanto.fam', FAM);
    const local = loadLocal();
    showApp(); setSync('⏳ conectando…');
    try {
      await initCloud(FAM);
      if (uploadLocal) cloud.claim().then(() => cloud.owner = cloud.uid).catch(console.error);
      if (uploadLocal && (local.events.length || local.cries.length)) {
        await cloud.bulk('events', local.events); await cloud.bulk('cries', local.cries);
        toast('Subí los registros que ya tenías ✓');
      }
      history.replaceState(null, '', location.pathname);
    } catch (e) { console.error(e); setSync('⚠️ sin conexión a la nube'); toast('No pude conectar. Revisa internet y vuelve a abrir.'); }
  };
  $('createBtn').onclick = () => go(genCode(), true);
  $('joinBtn').onclick = () => {
    const code = $('codeIn').value.trim().toUpperCase().replace(/\s+/g, '');
    if (!/^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(code)) { toast('Ese código no se ve bien. Debe ser como K7P3-Q9XD-M2RT'); return; }
    go(code, false);
  };
}
start();
refreshWeather(false);
setInterval(render, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
